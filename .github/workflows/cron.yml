name: Cron tick

# Every five minutes: publishes the jobs that are due and keeps the free
# Supabase project awake (the tick runs a real database query).
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   APP_URL      the deployed app, e.g. https://fanout-ai.vercel.app (no trailing slash)
#   CRON_SECRET  the same value as CRON_SECRET in the app's environment
#
# GitHub's schedule is best-effort: runs can start several minutes late, and
# scheduled workflows are switched off after 60 days without repository
# activity (GitHub emails a warning first; re-enable under Actions).

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: cron-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call the tick endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::APP_URL or CRON_SECRET is not set; nothing to do."
            exit 0
          fi
          # --fail-with-body: a 4xx/5xx fails the run but still prints the JSON error.
          # The secret travels in a header and never appears in the log.
          curl --silent --show-error --fail-with-body \
            --max-time 90 --retry 2 --retry-delay 10 \
            -X POST "$APP_URL/api/cron/tick" \
            -H "Authorization: Bearer $CRON_SECRET"
